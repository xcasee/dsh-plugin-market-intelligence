name: publish

# Pack on every run without registry credentials; publish only on a version tag
# (or a manual dispatch that explicitly opts in). Mirrors the official
# deepseek-harness "pack verifies, publish confirms" split.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish the packed tarball to npm'
        type: boolean
        default: false

jobs:
  pack:
    name: pack (no credentials)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # This package is built and tested with npm; the committed lockfile is
      # package-lock.json, so CI uses `npm ci` (a pnpm --frozen-lockfile install
      # would fail for lack of pnpm-lock.yaml).
      - run: npm ci --no-audit --no-fund
      - name: Verify tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          PKG=$(node -p "require('./package.json').version")
          TAG=${GITHUB_REF_NAME#v}
          if [ "$PKG" != "$TAG" ]; then
            echo "::error::tag $TAG does not match package.json version $PKG"
            exit 1
          fi
      - run: npm run typecheck
      - run: npm test
      - run: npm pack
      - uses: actions/upload-artifact@v4
        with:
          name: tarball
          path: '*.tgz'

  publish:
    name: publish to npm
    needs: pack
    if: startsWith(github.ref, 'refs/tags/v') || inputs.publish
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'
      - uses: actions/download-artifact@v4
        with:
          name: tarball
          path: dist
      - name: Publish to npm when NPM_TOKEN is configured
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::warning::NPM_TOKEN is not configured for this repository; skipping npm publish. Add it under Settings -> Secrets and variables -> Actions, then re-run this workflow."
            exit 0
          fi
          # The leading ./ matters: npm 11 otherwise reads dist/*.tgz as a GitHub shorthand.
          npm publish ./dist/*.tgz --provenance --access public

  release:
    name: GitHub release
    needs: pack
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: tarball
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.tgz
